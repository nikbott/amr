# Pre-commit hooks for amr/
# Install once:  pip install --user pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files   (or  make lint)
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: '\.(cpp|hpp|cu|cuh|h|cc)$'

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Skip the generated notebook and the Portuguese implementation walkthrough.
        exclude: '(\.ipynb$|WALKTHROUGH\.md$)'
        # Only false positives that actually occur: numer ("Numer." journal
        # abbrev), sequencial (Portuguese plot label), socio-economic (CoC text).
        args: ["--ignore-words-list=numer,sequencial,socio-economic"]

  # GitHub Actions workflows are code too: actionlint checks their syntax,
  # expressions and runner labels (configured in .github/actionlint.yaml).
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  # Local hook — never commit perf.data, SVGs, or binaries from cuda/.
  # These are build artifacts; .gitignore is the primary defense, this is the backstop.
  - repo: local
    hooks:
      - id: no-build-artifacts
        name: refuse to commit build artifacts
        entry: bash -c 'echo "Refusing to commit build artifacts (perf.data / *.svg / cuda binaries). Add to .gitignore." && exit 1'
        language: system
        files: '(perf\.data.*|mesh_.*\.svg|cuda/(amr|test)$)'
