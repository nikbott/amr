name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline as its gate.
  workflow_call:

# Cancel superseded runs on the same ref (don't waste runners on stale pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only token unless a job opts into more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- lint -------
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history to diff against the base ref
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pre-commit
      # clang-format / cmake-format come pinned from their pre-commit mirrors,
      # so no apt install is needed. Lint only the files this PR/push changed,
      # so the existing tree is not retroactively reformatted; new work must
      # still satisfy every hook.
      - name: pre-commit (changed files)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            # merge-base, not the base tip: lints exactly this PR's changes even
            # if the base branch has moved ahead.
            FROM="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            FROM="${{ github.event.before }}"
          fi
          # Only lint incrementally when FROM is a real ancestor of HEAD. After a
          # force-push / history rewrite the old 'before' SHA is orphaned (not an
          # ancestor); there's no meaningful incremental base, so skip rather than
          # fall back to --all-files (which would reformat the whole existing tree).
          if [ -n "$FROM" ] && [ "$FROM" != "0000000000000000000000000000000000000000" ] \
             && git merge-base --is-ancestor "$FROM" HEAD 2>/dev/null; then
            echo "Linting files changed in $FROM..HEAD"
            pre-commit run --from-ref "$FROM" --to-ref HEAD --show-diff-on-failure
          else
            echo "No usable incremental base (new branch or force-push) — skipping incremental lint."
            echo "Pull requests always lint against their merge-base, so new work is still covered."
          fi

  # ----------------------------------------------------- CPU build + test ------
  cpu:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # The supported range: GCC 13, the oldest (the local and MATLAB MEX
        # toolchain), and the newest GCC and Clang. Ubuntu 26.04 ships GCC
        # 13-15 and Clang 20-22; GCC 16 comes from its universe repository.
        compiler:
          - { cc: gcc-13, cxx: g++-13 }
          - { cc: gcc-16, cxx: g++-16 }
          - { cc: clang-22, cxx: clang++-22 }
        build_type: [Debug, Release]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v7
      # No distro Catch2: its static library is built with the image's default
      # GCC and does not link against an older libstdc++ (GCC 13 lacks
      # __cxa_call_terminate). CMake builds the pinned Catch2 with the job's
      # own compiler instead (CMakeLists.txt, FetchContent).
      - name: Install toolchain (OpenMP + MPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev \
            openmpi-bin libopenmpi-dev ccache ${{ matrix.compiler.cxx }}
      # clang needs the matching LLVM OpenMP runtime for CMake's FindOpenMP.
      # Scoped to clang jobs so this package can't break the gcc matrix entry.
      - name: Install clang OpenMP runtime
        if: startsWith(matrix.compiler.cc, 'clang')
        run: sudo apt-get install -y clang-22 libomp-22-dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler.cxx }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler.cxx }}-${{ matrix.build_type }}-
      # --oversubscribe: the runner may have fewer cores than the tests' ranks;
      # Open MPI 4 and 5 both accept the flag (5 ignores the old MCA variable).
      - name: Configure (OpenMP + MPI; sanitizers on Debug)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DAMR_BUILD_MPI=ON -DAMR_BUILD_CUDA=OFF -DMPIEXEC_PREFLAGS=--oversubscribe
          -DENABLE_SANITIZERS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel
      - name: Test (ctest; MPI over tcp,self to avoid the shared-mem btl hang)
        env:
          OMPI_MCA_btl: tcp,self
        run: ctest --test-dir build --output-on-failure
      - name: Upload ctest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ matrix.compiler.cxx }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------- CUDA compile only ------
  # GitHub-hosted runners have no GPU; we compile-check the CUDA backend here and
  # run it on a self-hosted GPU runner in the `gpu` job below.
  cuda-build:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The newest CUDA, with the newest GCC it accepts as host compiler (nvcc
      # 13.3 refuses GCC 16: "gcc versions later than 15 are not supported"),
      # for the project's GPU (A2000, sm_86).
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: network
          sub-packages: '["nvcc", "cudart", "thrust"]'
      - name: Install host toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libomp-dev
      - name: Configure + compile CUDA backend (no GPU run)
        run: |
          cmake -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_CUDA_HOST_COMPILER=g++-15 \
            -DAMR_BUILD_CUDA=ON -DAMR_CUDA_ARCHITECTURES=86 -DBUILD_TESTING=ON
          cmake --build build-cuda --target amr_cuda amr_cuda_tests

  # ------------------------------------------------------------ ci-ok ---------
  # The one check branch protection requires: it passes only when every job
  # above passed, so renaming or adding matrix entries never leaves protection
  # waiting on a check that no longer runs. Add a new required job to `needs`.
  ci-ok:
    if: always()
    needs: [lint, cpu, cuda-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # ------------------------------------------- GPU runtime (self-hosted) -------
  # Opt-in: manual `workflow_dispatch` only, run when the self-hosted GPU runner
  # (the project's A2000, `gpu` label) is online. Deliberately NOT triggered on
  # push/PR: with no runner online a self-hosted job sits `queued` indefinitely
  # and stalls the whole run, so GPU runtime validation is on-demand instead.
  gpu:
    needs: cuda-build
    # CI's own manual run only: as the release gate (workflow_call) the event is
    # the caller's, which may also be workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'CI' }}
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build + run CUDA tests and balance benchmark (needs a GPU)
        run: |
          cmake -B build-gpu -DCMAKE_BUILD_TYPE=Release \
            -DAMR_BUILD_CUDA=ON -DAMR_CUDA_ARCHITECTURES=86 -DBUILD_TESTING=ON
          cmake --build build-gpu --parallel --target amr_cuda_tests amr_cuda_bench
          ./build-gpu/amr_cuda_tests
          ./build-gpu/amr_cuda_bench
