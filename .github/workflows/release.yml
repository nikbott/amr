name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate is the CI pipeline itself, so a release passes exactly the checks
  # every pull request does: lint, every compiler and build type, the CUDA build.
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
