version: 2
updates:
  # Keep pinned GitHub Actions versions patched (security + bug fixes).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # Keep the Python reference-implementation deps current.
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
